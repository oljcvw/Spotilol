name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose the build variant to compile"
        required: true
        type: choice
        default: Release
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Determine build type
        shell: bash
        run: |
          TYPE="${{ inputs.build_type || 'Release' }}"
          TYPE_LOWER="$(echo "$TYPE" | tr '[:upper:]' '[:lower:]')"
          echo "BUILD_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "BUILD_TYPE_LOWER=$TYPE_LOWER" >> "$GITHUB_ENV"

      - name: Restore signing key when configured
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Signing secrets are not configured; a release build will be unsigned."
            exit 0
          fi

          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > signing/release.jks
          printf 'storeFile=signing/release.jks\nstorePassword=%s\nkeyAlias=spotifck\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew "assemble$BUILD_TYPE"

      - name: Name APK
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/$BUILD_TYPE_LOWER"
          APK_PATH="$(ls "$APK_DIR"/ReSpotifuck-*-"$BUILD_TYPE_LOWER".apk 2>/dev/null | head -n1 || true)"
          OUTPUT_NAME="respotifuck-$BUILD_TYPE_LOWER-$GITHUB_RUN_NUMBER.apk"

          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(ls "$APK_DIR"/ReSpotifuck-*-"$BUILD_TYPE_LOWER"-unsigned.apk | head -n1)"
            OUTPUT_NAME="respotifuck-$BUILD_TYPE_LOWER-unsigned-$GITHUB_RUN_NUMBER.apk"
          fi

          test -f "$APK_PATH"
          cp "$APK_PATH" "$APK_DIR/$OUTPUT_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: respotifuck-${{ env.BUILD_TYPE_LOWER }}-apk
          path: app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/respotifuck-*.apk
          overwrite: true
          retention-days: 14
          archive: false
